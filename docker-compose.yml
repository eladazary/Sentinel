# Sentinel — Phase 0 stack: api · worker · TimescaleDB · Redis · frontend.
#
#   cp .env.example .env   # add Alpaca keys
#   docker compose up --build
#
# API:      http://localhost:8000
# Frontend: http://localhost:5173

services:
  timescaledb:
    image: timescale/timescaledb:2.17.2-pg16
    environment:
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: sentinel
      POSTGRES_DB: sentinel
    volumes:
      - timescale_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinel -d sentinel"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    image: sentinel-backend:local
    command: ["api"]
    env_file:
      - path: .env
        required: false
    environment:
      # Override the .env defaults so containers reach each other by service name.
      SENTINEL_DATABASE_URL: postgresql+psycopg://sentinel:sentinel@timescaledb:5432/sentinel
      SENTINEL_REDIS_URL: redis://redis:6379/0
    depends_on:
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  worker:
    build: ./backend
    image: sentinel-backend:local
    command: ["worker"]
    env_file:
      - path: .env
        required: false
    environment:
      SENTINEL_DATABASE_URL: postgresql+psycopg://sentinel:sentinel@timescaledb:5432/sentinel
      SENTINEL_REDIS_URL: redis://redis:6379/0
    depends_on:
      # Wait for the API so migrations have run before the worker touches tables.
      api:
        condition: service_healthy

  frontend:
    build: ./frontend
    depends_on:
      - api
    ports:
      - "5173:80"

volumes:
  timescale_data:

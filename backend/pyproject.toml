[project]
name = "sentinel"
version = "0.1.0"
description = "Sentinel — focused stock signal & auto-trading system (Phase 0: ingestion + storage)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "alpaca-py>=0.33",
    "redis>=5.2",
    "pyyaml>=6.0",
    # Phase 1: signal model, features, backtesting.
    "numpy>=1.26",
    "pandas>=2.2",
    "lightgbm>=4.5",
    "scikit-learn>=1.5",
    "yfinance>=0.2.50",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
]

[project.scripts]
sentinel-worker = "sentinel.worker.main:main"
sentinel-backfill = "sentinel.cli:backfill_command"
sentinel-train = "sentinel.cli:train_command"
sentinel-backtest = "sentinel.cli:backtest_command"
sentinel-cycle = "sentinel.cli:cycle_command"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

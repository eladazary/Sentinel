server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Static SPA assets with client-side routing fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls to the backend. The trailing slash on both sides strips
    # the /api prefix so /api/watchlist -> http://api:8000/watchlist.
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
